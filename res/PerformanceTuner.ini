; Dynamic Performance Tuner for Fallout 4
;
; Place this file next to PerformanceTuner.dll (Data\F4SE\Plugins\PerformanceTuner.ini).
; If the file is missing, the built-in defaults are used.
;
; The tuner keeps the frame rate inside the band below by moving the directional shadow
; distance between the configured bounds. The engine caches the shadow distance internally,
; so nothing here has to be duplicated in the game INIs.

[Simple]
; The frame rate band. While FPS is above fMaxFPS the shadow distance grows; while FPS is
; below fMinFPS it is pulled in. Between the two values it holds still. Raise fMinFPS or
; lower fMaxFPS to track the target more closely; widen them to be calmer about spikes.
fMaxFPS=70
fMinFPS=64

; Momentum (shadow distance units per frame) accelerates while moving in one direction.
; Decreasing is deliberately faster than increasing.
fMomentumDownAcceleration=1.1
fMinMomentum=-64
fMomentumUpAcceleration=1.05
fMaxMomentum=1

; Bounds for the directional shadow distance.
fShadowDirDistanceMin=3000
fShadowDirDistanceMax=8000

; Adjust the volumetric light (godray) quality from the current shadow distance.
bAdjustGRQuality=0

; Bounds for the mapped godray quality (0 = lowest, 3 = highest). A higher floor keeps
; the godrays from becoming blocky at short shadow distances.
iMinGRQuality=0
iMaxGRQuality=3

fGRQualityShadowDist1=3000
fGRQualityShadowDist2=6000
fGRQualityShadowDist3=10000

; Alternatively (or additionally) reduce the godray grid resolution. Lower values make the
; beams chunkier and cheaper; the value is interpolated from fShadowDirDistanceMin
; (iGRGridMin) to fShadowDirDistanceMax (iGRGridMax). Useful if lowering the quality level
; looks worse to you than coarser beams.
bAdjustGRGrid=0
iGRGridMin=6
iGRGridMax=16

[Advanced]
; Seconds of frame history used for the frame rate estimate. Short spikes (camera turns,
; streaming) stay below this window and are ignored; sustained changes still move it.
fLoadWindowTime=2.0

; Seconds to ignore after a load or menu close, while streaming and physics settle.
fResumeGraceTime=1.0

; Write the current state to the F4SE log once every 1/fDebugMessageFrequency seconds.
bShowDiagnostics=0
fDebugMessageFrequency=1

